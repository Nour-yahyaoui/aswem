[package]
name = "aswem-api"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Aswem API: open, community-driven price reports for Tunisia"
repository = "https://github.com/Nour-yahyaoui/riseoftheconqueror"

[dependencies]
actix-web = "4.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "macros",
    "migrate",
] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
